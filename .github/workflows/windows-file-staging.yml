name: Windows file staging

on:
  pull_request:
    branches: [master]
    paths:
      - packages/native/src/file-download-staging.h
      - packages/native/tests/windows-file-staging/**
      - .github/workflows/windows-file-staging.yml
  push:
    branches: [master]
    paths:
      - packages/native/src/file-download-staging.h
      - packages/native/tests/windows-file-staging/**
      - .github/workflows/windows-file-staging.yml

permissions:
  contents: read

concurrency:
  group: windows-file-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-file-staging:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the Qt Core and Test kit
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          archives: qtbase
          cache: true
      - name: Configure the isolated production staging helper checks
        run: cmake -S packages/native/tests/windows-file-staging -B build/windows-file-staging -A x64
      - name: Build
        run: cmake --build build/windows-file-staging --config Release --parallel 2
      - name: Check Windows file identity, no-replace publication and permissions
        run: ctest --test-dir build/windows-file-staging -C Release --output-on-failure
