name: Windows and macOS desktop packages
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  archive:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: packages/native/tests/platform-package
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-arm64
          run-id: 44833977258
          github-token: ${{ github.token }}
          path: archive
      - shell: pwsh
        run: |
          $archive = Get-Item archive/workspace-native-windows-arm64.zip
          if ((Get-FileHash $archive).Hash -ne ((Get-Content archive/SHA256SUMS) -split "\s+")[0]) { throw "Archive digest mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP 'Workspace relocated'
          Expand-Archive $archive -DestinationPath $destination
          ./packages/native/tests/platform-package/windows-window.ps1 -Executable "$destination/bin/workspace-native.exe" -Architecture arm64
