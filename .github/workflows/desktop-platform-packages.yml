name: Windows and macOS desktop packages

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/desktop-platform-packages.yml
      - packages/native/CMakeLists.txt
      - packages/native/packaging/windows-*
      - packages/native/resources/macos-info.plist.in
      - packages/native/src/main.cpp
      - packages/native/src/native-instance.*
      - packages/native/scripts/build-desktop-package.py
      - packages/native/tests/platform-package/**
      - packages/native/tests/platform-shell/**
      - packages/native/src/native-platform-shell*
      - packages/native/src/native-desktop.*
      - packages/native/src/native-notifications.*
      - packages/native/src/native-updater-taskbar.*
      - packages/native/src/native-updater.*
      - packages/native/src/session.*
      - packages/native/src/session-vault.*
      - packages/native/qml/Main.qml
      - packages/native/qml/NativeAboutDrawer.qml
      - packages/native/qml/NativeCallWebEngineView.qml
      - packages/native/qml/NativeCallWindow.qml
      - packages/native/qml/ShellIconButton.qml
  push:
    tags: ['[0-9]*']

permissions:
  contents: read

concurrency:
  group: desktop-platform-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-2022, arch: win64_msvc2022_64, cpu: x64 }
          - { platform: windows-arm64, runner: windows-11-arm, host: windows_arm64, arch: win64_msvc2022_arm64, cpu: arm64 }
          - { platform: macos-arm64, runner: macos-15, arch: clang_64 }
          - { platform: macos-x64, runner: macos-15-intel, arch: clang_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: mity/md4c
          ref: 729e6b8b320caa96328968ab27d7db2235e4fb47 # 0.5.2
          path: deps/md4c
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: frankosterfeld/qtkeychain
          ref: ad7344c45a86a4f66cbafc4b081b5f7b876cb0b7 # 0.15.0
          path: deps/qtkeychain
          persist-credentials: false
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.10.2'
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: qtwebsockets qtmultimedia qtpositioning qtwebchannel ${{ matrix.platform != 'windows-arm64' && 'qtwebengine' || '' }}
          cache: true
      - name: Install native Windows ARM64 Qt WebEngine
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          # Qt publishes this extension under msvc2022_arm64. The installer looks under win64_msvc2022_arm64.
          $url = 'https://download.qt.io/online/qtsdkrepository/windows_arm64/extensions/qtwebengine/6102/msvc2022_arm64/extensions.qtwebengine.6102.win64_msvc2022_arm64/6.10.2-0-202601261211qtwebengine-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-ARM64.7z'
          $archive = Join-Path $env:RUNNER_TEMP qtwebengine-arm64.7z
          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '8172bcb72cef631ed1e7b7daaa12d32b28b0c2fd5b87ca62b1e66e42a559b6d1') { throw 'Unexpected Qt WebEngine archive checksum.' }
          7z x -y "-o$env:QT_ROOT_DIR" $archive | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Identify the Windows package registry
        if: runner.os == 'Windows'
        id: vcpkg
        shell: pwsh
        run: |
          $registry = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          "registry=$registry" >> $env:GITHUB_OUTPUT
          $cache = Join-Path $env:RUNNER_TEMP workspace-vcpkg-cache
          New-Item -ItemType Directory -Force $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
      - name: Restore Windows OpenSSL binaries
        if: runner.os == 'Windows'
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/workspace-vcpkg-cache
          key: workspace-openssl-${{ matrix.cpu }}-static-md-${{ steps.vcpkg.outputs.registry }}
      - name: Install OpenSSL for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:${{ matrix.cpu }}-windows-static-md --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WORKSPACE_OPENSSL_PREFIX=$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.cpu }}-windows-static-md" >> $env:GITHUB_ENV
      - name: Save compiled Windows OpenSSL binaries
        if: runner.os == 'Windows' && steps.openssl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/workspace-vcpkg-cache
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}
      - name: Select OpenSSL for macOS
        if: runner.os == 'macOS'
        run: |
          brew list --versions openssl@3 || brew install openssl@3
          echo "WORKSPACE_OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the Windows 11 Explorer desktop
        if: matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class DesktopShell {
              [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string name, string title);
              [DllImport("kernel32.dll")] public static extern uint WTSGetActiveConsoleSessionId();
          }
          "@
          $session = (Get-Process -Id $PID).SessionId
          Write-Output "Runner session $session, active console session $([DesktopShell]::WTSGetActiveConsoleSessionId())."
          Get-Process -Name explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId
          if ([DesktopShell]::FindWindow('Shell_TrayWnd', $null) -eq [IntPtr]::Zero) {
              Start-Process "$env:WINDIR/explorer.exe"
              $deadline = (Get-Date).AddSeconds(20)
              while ([DesktopShell]::FindWindow('Shell_TrayWnd', $null) -eq [IntPtr]::Zero -and (Get-Date) -lt $deadline) {
                  Start-Sleep -Milliseconds 250
              }
          }
          Write-Output "Explorer taskbar handle $([DesktopShell]::FindWindow('Shell_TrayWnd', $null))."
      - name: Prepare the per-user Windows Installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'workspace-cpack'
          python -m pip install --only-binary=:all: --no-deps --target $tools cmake==4.3.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WORKSPACE_CPACK=$tools/cmake/data/bin/cpack.exe" >> $env:GITHUB_ENV
          if (!(Get-Command candle.exe -ErrorAction SilentlyContinue) -and !(Test-Path "$env:WIX/bin/candle.exe")) {
            $archive = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
            Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile $archive
            if ((Get-FileHash $archive).Hash -ne '6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31') { throw 'Unexpected WiX toolset checksum.' }
            $wix = Join-Path $env:RUNNER_TEMP 'workspace-wix'
            Expand-Archive -LiteralPath $archive -DestinationPath $wix
            "WIX=$wix" >> $env:GITHUB_ENV
          }
      - name: Check ownership of removed files across two Windows installer versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/native/tests/platform-package/windows-installer-upgrade.ps1
      - name: Build and archive the desktop application
        env:
          WORKSPACE_PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: python packages/native/scripts/build-desktop-package.py
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('build/desktop-package/archives/SHA256SUMS') != '' }}
        with:
          name: desktop-${{ matrix.platform }}
          path: build/desktop-package/archives/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  launch:
    name: Launch ${{ matrix.platform }} archive
    needs: package
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-2022, cpu: x64 }
          - { platform: windows-arm64, runner: windows-11-arm, cpu: arm64 }
          - { platform: macos-arm64, runner: macos-15, cpu: arm64 }
          - { platform: macos-x64, runner: macos-15-intel, cpu: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: packages/native/tests/platform-package
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: archive
      - name: Verify and run the relocated Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-Item "archive/workspace-native-${{ matrix.platform }}.zip"
          $expected = ((Get-Content archive/SHA256SUMS) -split "\s+")[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw "Archive checksum mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP "Workspace relocated"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $drivers = @(Get-ChildItem "$destination/plugins/sqldrivers/*.dll")
          if ($drivers.Count -ne 1 -or $drivers[0].Name -ne 'qsqlite.dll') { throw "Unexpected SQL driver inventory" }
          ./packages/native/tests/platform-package/windows-window.ps1 -Executable "$destination/bin/workspace-native.exe" -Architecture ${{ matrix.cpu }}
          python packages/native/tests/platform-package/desktop-account-acceptance.py "$destination/bin/workspace-native.exe" --check-updater --check-capture
      - name: Install, launch and uninstall the Windows application for the current user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packages/native/tests/platform-package/windows-installer.ps1 -Architecture ${{ matrix.cpu }} -Installer "archive/workspace-native-${{ matrix.platform }}-setup.msi"
      - name: Verify and run the relocated macOS application
        if: runner.os == 'macOS'
        run: |
          (cd archive && shasum -a 256 -c SHA256SUMS)
          destination="$RUNNER_TEMP/Workspace relocated"
          mkdir -p "$destination"
          test "$(uname -m)" = "${{ matrix.cpu }}"
          ditto -x -k "archive/workspace-native-${{ matrix.platform }}.zip" "$destination"
          lipo "$destination/workspace-native.app/Contents/MacOS/workspace-native" -verify_arch "${{ matrix.cpu }}"
          drivers="$destination/workspace-native.app/Contents/PlugIns/sqldrivers"
          test -f "$drivers/libqsqlite.dylib"
          test "$(find "$drivers" -name '*.dylib' | wc -l | tr -d ' ')" = 1
          codesign --verify --deep --strict "$destination/workspace-native.app"
          startup="$RUNNER_TEMP/workspace-packaged-startup.log"
          if ! QT_DEBUG_PLUGINS=1 swift packages/native/tests/platform-package/macos-window.swift \
              "$destination/workspace-native.app/Contents/MacOS/workspace-native" 2>"$startup"; then
            tail -50 "$startup"
            exit 1
          fi
          python3 packages/native/tests/platform-package/macos-startup-icons.py "$startup"
          python3 packages/native/tests/platform-package/desktop-account-acceptance.py "$destination/workspace-native.app/Contents/MacOS/workspace-native" --check-updater --check-capture
