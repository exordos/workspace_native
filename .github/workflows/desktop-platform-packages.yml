name: Check published preview archives on clean native desktops
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop to exercise
        type: choice
        default: both
        options: [both, windows, macos]
      slice:
        description: Installed application scenario
        type: choice
        default: account
        options: [account, update, media, window]
permissions:
  contents: read
  actions: read
jobs:
  launch:
    name: Launch ${{ matrix.platform }} archive
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'windows' && '[{"platform":"windows-x64","runner":"windows-2022"}]' || inputs.platform == 'macos' && '[{"platform":"macos-arm64","runner":"macos-15"}]' || '[{"platform":"windows-x64","runner":"windows-2022"},{"platform":"macos-arm64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: packages/native/tests/platform-package
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: archive
          github-token: ${{ github.token }}
          run-id: 44821397480
      - name: Verify and run the relocated Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-Item archive/workspace-native-windows-x64.zip
          $expected = ((Get-Content archive/SHA256SUMS) -split "\s+")[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw "Archive checksum mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP "Workspace relocated"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $drivers = @(Get-ChildItem "$destination/plugins/sqldrivers/*.dll")
          if ($drivers.Count -ne 1 -or $drivers[0].Name -ne 'qsqlite.dll') { throw "Unexpected SQL driver inventory" }
          if ('${{ inputs.slice }}' -eq 'window') {
            foreach ($attempt in 1..3) {
              ./packages/native/tests/platform-package/windows-window.ps1 -Executable "$destination/bin/workspace-native.exe"
            }
          } elseif ('${{ inputs.slice }}' -eq 'media') {
            $env:CASSI_CAPTURE_FIXTURE = '1'
            python packages/native/tests/platform-package/desktop-account-acceptance.py "$destination/bin/workspace-native.exe" --check-media
          } elseif ('${{ inputs.slice }}' -eq 'update') {
            python packages/native/tests/platform-package/desktop-account-acceptance.py "$destination/bin/workspace-native.exe" --check-updater
          } else {
            python packages/native/tests/platform-package/desktop-account-acceptance.py "$destination/bin/workspace-native.exe"
          }
      - name: Verify and run the relocated macOS application
        if: runner.os == 'macOS'
        run: |
          (cd archive && shasum -a 256 -c SHA256SUMS)
          destination="$RUNNER_TEMP/Workspace relocated"
          mkdir -p "$destination"
          ditto -x -k archive/workspace-native-macos-arm64.zip "$destination"
          drivers="$destination/workspace-native.app/Contents/PlugIns/sqldrivers"
          test -f "$drivers/libqsqlite.dylib"
          test "$(find "$drivers" -name '*.dylib' | wc -l | tr -d ' ')" = 1
          codesign --verify --deep --strict "$destination/workspace-native.app"
          if [ "${{ inputs.slice }}" = "window" ]; then
            for attempt in 1 2 3; do
              if ! swift packages/native/tests/platform-package/macos-window.swift "$destination/workspace-native.app/Contents/MacOS/workspace-native" 2>"$RUNNER_TEMP/window-check.log"; then
                tail -40 "$RUNNER_TEMP/window-check.log"
                exit 1
              fi
            done
          elif [ "${{ inputs.slice }}" = "update" ]; then
            python3 packages/native/tests/platform-package/desktop-account-acceptance.py "$destination/workspace-native.app/Contents/MacOS/workspace-native" --check-updater
          elif [ "${{ inputs.slice }}" = "media" ]; then
            python3 packages/native/tests/platform-package/desktop-account-acceptance.py "$destination/workspace-native.app/Contents/MacOS/workspace-native" --check-media
          else
            python3 packages/native/tests/platform-package/desktop-account-acceptance.py "$destination/workspace-native.app/Contents/MacOS/workspace-native"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && inputs.slice == 'update'
        with:
          name: synthetic-update-card
          path: ${{ runner.temp }}/updater-card.png
          if-no-files-found: warn
          retention-days: 1
