name: Inspect the Windows Explorer notification area
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 4
    steps:
      - shell: powershell
        run: |
          Add-Type -ReferencedAssemblies System.Drawing,System.Windows.Forms -TypeDefinition @'
          using System;
          using System.Drawing;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Windows.Forms;
          public static class DesktopTray {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32",CharSet=CharSet.Unicode)] static extern IntPtr FindWindow(string c,string t);
            [DllImport("user32",CharSet=CharSet.Unicode)] static extern IntPtr FindWindowEx(IntPtr p,IntPtr a,string c,string t);
            [DllImport("user32")] static extern bool GetWindowRect(IntPtr h,out RECT r);
            [DllImport("user32")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32")] static extern IntPtr SendMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
            [DllImport("user32")] static extern bool DestroyIcon(IntPtr h);
            static bool mark(Color p) {return p.R>200 && p.B>200 && p.G<30;}
            static int capture(IntPtr h) {
              if(h==IntPtr.Zero || !IsWindowVisible(h)) return -1;
              RECT r;GetWindowRect(h,out r);int w=r.Right-r.Left,ht=r.Bottom-r.Top;if(w<=0||ht<=0)return -2;
              using(var b=new Bitmap(w,ht)) { using(var g=Graphics.FromImage(b)) g.CopyFromScreen(r.Left,r.Top,0,0,b.Size);int found=0;
                for(int y=0;y<ht;y++)for(int x=0;x<w;x++)if(mark(b.GetPixel(x,y)))found++;return found;}
            }
            static void pump(int ms){var stop=DateTime.UtcNow.AddMilliseconds(ms);while(DateTime.UtcNow<stop){Application.DoEvents();System.Threading.Thread.Sleep(20);}}
            public static void Run() {
              IntPtr bar=FindWindow("Shell_TrayWnd",null),notify=FindWindowEx(bar,IntPtr.Zero,"TrayNotifyWnd",null);
              IntPtr button=FindWindowEx(notify,IntPtr.Zero,"Button",null);
              Console.WriteLine("Taskbar={0} notify={1} overflow button={2}",bar!=IntPtr.Zero,notify!=IntPtr.Zero,button!=IntPtr.Zero);
              using(var b=new Bitmap(16,16)) using(var g=Graphics.FromImage(b)) using(var tray=new NotifyIcon()){
                g.Clear(Color.Magenta);var handle=b.GetHicon();try{
                  using(var icon=Icon.FromHandle(handle)){tray.Icon=icon;tray.Text="Workspace acceptance marker";tray.Visible=true;
                    pump(1000);Console.WriteLine("Closed tray marker pixels={0}",capture(notify));
                    if(button!=IntPtr.Zero)SendMessage(button,0x00F5,IntPtr.Zero,IntPtr.Zero);
                    pump(700);var overflow=FindWindow("NotifyIconOverflowWindow",null);int pixels=capture(overflow);
                    Console.WriteLine("Open overflow={0} marker pixels={1}, visible tray pixels={2}",overflow!=IntPtr.Zero,pixels,capture(notify));
                    if(pixels<=0 && capture(notify)<=0)throw new Exception("Explorer did not paint the marker");
                    tray.Visible=false;}}
                finally{DestroyIcon(handle);}
              }
            }
          }
          '@
          [DesktopTray]::Run()
