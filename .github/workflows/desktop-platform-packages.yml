name: Check the Windows taskbar button lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.10.2'
          arch: win64_msvc2022_64
          cache: true
      - name: Build the repository shell and run its native regression
        shell: pwsh
        run: |
          cmake -S .github/taskbar-control -B build-control
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build-control --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $code = 0
          foreach ($case in @('progressReachesTheExplorerTaskbarAndClears','minimizedWindowKeepsReceivingTaskbarHints')) {
            & ./build-control/Release/shell-control.exe $case -o shell-control.txt,txt
            if ($LASTEXITCODE) { $code = $LASTEXITCODE }
            Get-Content shell-control.txt -Encoding utf8
          }
          exit $code
