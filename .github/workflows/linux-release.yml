name: Linux release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version; empty uses CMake project version
        required: false
        type: string
  push:
    branches: [master]
    tags:
      - "[0-9]*"
  pull_request:

# Superseded PR runs are cancelled; push/tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  master-gate-reuse:
    # Tag publishing reuses the full-suite verdict of the master push on the
    # same commit (process decision 2026-11-26). The tagged sha is the master
    # tip, whose push pipeline runs the identical package-linux and
    # full-gate-linux checks. Waiting for that verdict removes a duplicated
    # full-suite run from the publish path without weakening it: a release
    # still requires a green full gate on exactly the released sha. Without a
    # complete green push verdict within the window the publish job falls back
    # to running the full gate itself; a red push verdict blocks the release.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    timeout-minutes: 75
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
    steps:
      - name: Check out the gate verdict script
        uses: actions/checkout@v6
      - name: Wait for the master-push gate verdict on this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          deadline=$(( SECONDS + 3000 ))
          reuse=false
          while :; do
            # exordy findings 4712353365/369: the commit check-runs listing
            # is paginated and a TRUNCATED listing must never authorize
            # reuse. Pagination lives in the tested script (--fetch mode):
            # it fetches every page until a short page ends the listing and
            # exits non-zero on truncation or gh failure, so the verdict
            # below is only ever computed from complete pages.
            fetch_ok=false
            rm -f check-runs-page-*.json
            if python3 packages/native/scripts/master-gate-verdict.py \
                --fetch "${GATE_SHA}" --repo "${GITHUB_REPOSITORY}" \
                --out-prefix check-runs-page-; then
              fetch_ok=true
            fi
            if [ "${fetch_ok}" = true ]; then
              # The decision lives in one script that is covered by a
              # regression test (packages/native/tests/
              # master-gate-verdict-test.py). Verdicts:
              #   block = a matching master-push check completed non-success,
              #           fail at once - one red must never be outraced;
              #   wait  = keep polling. Reuse is only accepted once EVERY
              #           matching run has completed: an older green pair
              #           must not authorize publication while a newer
              #           matching run (re-check, rerun, or a second master
              #           push of the same sha) may still return red;
              #   reuse = completed green verdicts for each required name.
              verdict=$(python3 packages/native/scripts/master-gate-verdict.py \
                  check-runs-page-*.json) || true
              if [[ "${verdict}" == block ]]; then
                echo "::error::A master-push gate check on ${GATE_SHA} completed non-success; refusing to publish this tag."
                exit 1
              fi
              if [[ "${verdict}" == reuse ]]; then
                echo "The master-push gate on ${GATE_SHA} is green with no matching run still in flight; publishing reuses its verdict."
                reuse=true
                break
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "No complete master-push gate verdict within the window; the publish job runs the full gate itself."
              break
            fi
            sleep 30
          done
          echo "reuse=${reuse}" >> "${GITHUB_OUTPUT}"

  package-linux:
    needs: master-gate-reuse
    if: ${{ always() && (needs.master-gate-reuse.result == 'success' || needs.master-gate-reuse.result == 'skipped') && (github.event_name != 'pull_request' || github.base_ref == 'master') }}
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 90
    env: &linux-env
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      # The runner network cannot reach archive.ubuntu.com / security.ubuntu.com,
      # so point APT at the Yandex mirror first, same as workspace_ui's CI.
      # The egress path performs TLS interception whose CA is installed on the
      # runner host but not in the plain ubuntu:26.04 container, so the mirror
      # is reached over plain HTTP: APT still verifies InRelease signatures
      # against the keyring, so repository integrity does not depend on TLS.
      # Runs as root inside the container, hence no sudo.
      - &mirror
        name: Use Yandex Ubuntu mirror
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apt_sources < <(
            find -L /etc/apt -maxdepth 2 -type f \
              \( -name sources.list -o -name '*.list' -o -name '*.sources' \) -print
          )
          ((${#apt_sources[@]} > 0))

          configured=0
          for source in "${apt_sources[@]}"; do
            if grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' "${source}"; then
              printf '%s\tpriority:1\n' \
                'http://mirror.yandex.ru/ubuntu/' \
                | tee /etc/apt/apt-mirrors.txt
              configured=1
            fi

            if grep -Eq \
              'https?://([[:alnum:].-]+\.)?archive\.ubuntu\.com/ubuntu/?|https?://security\.ubuntu\.com/ubuntu/?' \
              "${source}"; then
              sed -i -E \
                -e 's#https?://([[:alnum:].-]+\.)?archive\.ubuntu\.com/ubuntu/?#http://mirror.yandex.ru/ubuntu#g' \
                -e 's#https?://security\.ubuntu\.com/ubuntu/?#http://mirror.yandex.ru/ubuntu#g' \
                "${source}"
              configured=1
            fi
          done

          ((configured == 1))
          grep -H --fixed-strings \
            'http://mirror.yandex.ru/ubuntu' "${apt_sources[@]}" \
            || grep -H --fixed-strings \
              'http://mirror.yandex.ru/ubuntu' /etc/apt/apt-mirrors.txt

      - &dependencies
        name: Install documented build and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates git build-essential binutils pkg-config python3 python3-yaml ccache \
            cmake ninja-build patchelf gh nodejs qt6-base-dev qt6-image-formats-plugins \
            qt6-declarative-dev qt6-svg-dev qt6-svg-plugins qt6-websockets-dev qt6-l10n-tools \
            qt6-translations-l10n qt6-wayland qtkeychain-qt6-dev qt6-multimedia-dev \
            dbus-daemon \
            libqt6sql6-sqlite libmd4c-dev libssl-dev \
            libheif-dev libheif1 libheif-plugin-libde265 libde265-0 \
            qt6-webengine-dev libqt6webenginecore6-bin libqt6webengine6-data \
            qml6-module-qtquick qml6-module-qtquick-dialogs \
            qml6-module-qtmultimedia \
            qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects \
            qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript

      - &checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Restore compiler cache for the release build
        uses: actions/cache@v4
        with:
          path: .ccache
          key: linux-release-ccache-v1-${{ github.sha }}
          restore-keys: linux-release-ccache-v1-

      - name: Check repository for generated artifacts
        # The release container and checkout action run as different users.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        run: sh packages/native/tests/repository-artifacts-test.sh

      - name: Validate native engineering guide links
        run: python3 packages/native/tests/engineering-docs-test.py

      - name: Check installer and package-version regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/native/tests/linux-installer-test.py -v
          python3 packages/native/tests/platform-package/test-workflow-paths.py -v
          python3 packages/native/tests/linux-package-test.py -v
          python3 packages/native/tests/release-notes-test.py -v
          python3 packages/native/tests/gen-test-buckets-test.py -v
          python3 packages/native/tests/matched-screenshot-acceptance-test.py -v
          python3 packages/native/tests/warm-navigation-benchmark-test.py -v
          python3 packages/native/tests/live-workspace-acceptance-test.py -v
          python3 packages/native/tests/master-gate-verdict-test.py -v

      - name: Configure Release and installed runtime probe
        shell: bash
        run: |
          set -euo pipefail
          cmake -S packages/native -B build/linux-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/linux-release --target workspace-native native-runtime-probe native-updater-test native-about-policy-test native-updater-http2-recovery-driver native-updater-http2-controls-driver api-client-test realtime-client-test domain-test native-draft-store-test native-draft-service-test native-drafts-test native-draft-sync-test --parallel "$(nproc)"

      - name: Check drafts, realtime events, HTTP metadata, update transport and About contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          dbus-run-session -- ctest --test-dir build/linux-release --parallel "$(nproc)"
          -R '^native-(api-client|realtime-client|domain|native-draft-(store|service|sync)|native-drafts|updater|updater-http2-.*|about-policy)$'
          --output-on-failure --no-tests=error

      - name: Run the full release gate on Xvnc and Openbox
        if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && needs.master-gate-reuse.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apt-get install --no-install-recommends -y tigervnc-standalone-server openbox xauth x11-utils pulseaudio qml6-module-qtwebengine qml6-module-qtwebchannel qt6-gtk-platformtheme fonts-noto-core fonts-noto-color-emoji libgl1-mesa-dri libglib2.0-bin xdg-desktop-portal xdg-desktop-portal-gtk
          cmake --build build/linux-release --parallel "$(nproc)"
          # Hosted container jobs run as root with a runner-owned home. PulseAudio
          # and desktop portals use the identity and home of a real desktop user.
          useradd --create-home --user-group --shell /bin/bash cassi-native-ci
          mkdir -p build/linux-release/Testing
          chown -R cassi-native-ci:cassi-native-ci build/linux-release/Testing
          if [[ ! -S /run/dbus/system_bus_socket ]]; then
            mkdir -p /run/dbus
            system_bus_pid=$(dbus-daemon --system --fork --nopidfile --print-pid=1)
            trap 'kill "$system_bus_pid"' EXIT
          fi
          runuser -u cassi-native-ci -- bash packages/native/tests/full-linux-gate.sh build/linux-release

      - name: Finish the release build when the push-gate verdict was reused
        if: (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && needs.master-gate-reuse.outputs.reuse == 'true'
        run: cmake --build build/linux-release --parallel "$(nproc)"

      - name: Package installed runtime
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tag_version="${GITHUB_REF_NAME}"
            if [[ -n "${version}" && "${version}" != "${tag_version}" ]]; then
              echo 'Version input does not match tag' >&2
              exit 1
            fi
            version="${tag_version}"
          fi
          if [[ -z "${version}" ]]; then
            version=$(sed -nE 's/^project\(WorkspaceNative VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' packages/native/CMakeLists.txt)
          fi
          version_args=()
          if [[ -n "${version}" ]]; then
            if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo 'Expected stable X.Y.Z' >&2
              exit 1
            fi
            version_args=(--version "${version}")
          fi
          python3 packages/native/scripts/package-linux.py \
            --build-dir "${GITHUB_WORKSPACE}/build/linux-release" \
            --output-dir "${GITHUB_WORKSPACE}/dist/linux" \
            "${version_args[@]}"
          python3 packages/native/tests/verify-installed-runtime.py \
            "${GITHUB_WORKSPACE}/dist/linux/workspace-native-${version}-linux-x86_64" \
            --probe "${GITHUB_WORKSPACE}/build/linux-release/native-runtime-probe"

      - name: Upload Linux packages for review
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: workspace-native-linux-${{ github.sha }}
          path: |
            dist/linux/*.tar.gz
            dist/linux/SHA256SUMS
            dist/linux/package-result.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish Linux release in this repository
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/native/scripts/release-notes.py \
            --version "${GITHUB_REF_NAME}" \
            --out "build/release-notes-${GITHUB_REF_NAME}.md"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --title "Workspace Native ${GITHUB_REF_NAME} — Linux preview" \
            --notes-file "build/release-notes-${GITHUB_REF_NAME}.md" \
            dist/linux/*.tar.gz dist/linux/SHA256SUMS

  headless-tests:
    name: Headless ${{ matrix.suite }} tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: controller
            workers: 16
            include_label: '^controller$'
            exclude_label: '^gui$'
          - suite: other
            workers: 16
            include_label: '^headless$'
            exclude_label: '^(gui|controller)$'
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    permissions:
      contents: read
    timeout-minutes: 45
    env: *linux-env
    steps:
      - *mirror
      - *dependencies
      - *checkout
      - name: Restore compiler cache for the headless build
        id: headless-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: linux-headless-${{ matrix.suite }}-ccache-v3-${{ github.sha }}
          restore-keys: linux-headless-${{ matrix.suite }}-ccache-v3-
      - name: Build the headless test executables
        shell: bash
        run: |
          set -euo pipefail
          cmake -S packages/native -B build/headless -G Ninja -DBUILD_TESTING=ON \
            -DWORKSPACE_NATIVE_QUICK_GATE=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/headless --target native-headless-${{ matrix.suite }}-tests --parallel "$(nproc)"
          ccache --show-stats
      - name: Save compiled test objects
        if: steps.headless-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: linux-headless-${{ matrix.suite }}-ccache-v3-${{ github.sha }}
      - name: Run all headless groups
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          env -u DISPLAY -u WAYLAND_DISPLAY dbus-run-session --
          ctest --test-dir build/headless -L '${{ matrix.include_label }}' -LE '${{ matrix.exclude_label }}'
          --parallel ${{ matrix.workers }} --output-on-failure --no-tests=error

  full-gate:
    # The whole CTest suite (gui + headless + controller) runs in CI as parallel
    # shards, each with its own private Xvnc/Openbox desktop, so a green PR or
    # master push already covers what the local pre-release gate used to cover.
    # Each shard runs the stride slice -I <shard>,<total>,<shards> of the full
    # test list; slices are equal-sized by registration order.
    name: Full gate shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    permissions:
      contents: read
    timeout-minutes: 75
    env: *linux-env
    steps:
      - *mirror
      - *dependencies
      - name: Install desktop gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y \
            tigervnc-standalone-server openbox xauth x11-utils pulseaudio \
            qml6-module-qtwebengine qml6-module-qtwebchannel qt6-gtk-platformtheme \
            fonts-noto-core fonts-noto-color-emoji libgl1-mesa-dri libglib2.0-bin \
            xdg-desktop-portal xdg-desktop-portal-gtk
      - *checkout
      - name: Restore compiler cache for the full gate
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: linux-release-ccache-v1-${{ github.sha }}
          restore-keys: linux-release-ccache-v1-
      - name: Configure and build the full gate tree
        shell: bash
        run: |
          set -euo pipefail
          cmake -S packages/native -B build/linux-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/linux-release --parallel "$(nproc)"
          ccache --show-stats
      - name: Run the gate shard on a private Xvnc and Openbox desktop
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --user-group --shell /bin/bash cassi-native-ci
          mkdir -p build/linux-release/Testing
          chown -R cassi-native-ci:cassi-native-ci build/linux-release/Testing
          if [[ ! -S /run/dbus/system_bus_socket ]]; then
            mkdir -p /run/dbus
            system_bus_pid=$(dbus-daemon --system --fork --nopidfile --print-pid=1)
            trap 'kill "$system_bus_pid"' EXIT
          fi
          total=$(ctest --test-dir build/linux-release -N | sed -n 's/^Total Tests: *//p')
          [[ -n "${total}" ]]
          runuser -u cassi-native-ci -- bash packages/native/tests/full-linux-gate.sh \
            build/linux-release -I "${{ matrix.shard }},${total},6"

  full-gate-linux:
    name: full-gate-linux
    needs: full-gate
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check all full gate shard results
        env:
          RESULT: ${{ needs.full-gate.result }}
        run: test "$RESULT" = success

  quick-linux:
    needs: headless-tests
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check both headless test results
        env:
          RESULT: ${{ needs.headless-tests.result }}
        run: test "$RESULT" = success
