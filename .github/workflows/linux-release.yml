name: Linux release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional package version; empty uses CMake project version
        required: false
        type: string
  push:
    branches: [master]
    tags:
      - "[0-9]*"
  pull_request:
    branches: [master]

# Superseded PR runs are cancelled; push/tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  package-linux:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      # The runner network cannot reach archive.ubuntu.com / security.ubuntu.com,
      # so point APT at the Yandex mirror first, same as workspace_ui's CI.
      # The egress path performs TLS interception whose CA is installed on the
      # runner host but not in the plain ubuntu:26.04 container, so the mirror
      # is reached over plain HTTP: APT still verifies InRelease signatures
      # against the keyring, so repository integrity does not depend on TLS.
      # Runs as root inside the container, hence no sudo.
      - name: Use Yandex Ubuntu mirror
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apt_sources < <(
            find -L /etc/apt -maxdepth 2 -type f \
              \( -name sources.list -o -name '*.list' -o -name '*.sources' \) -print
          )
          ((${#apt_sources[@]} > 0))

          configured=0
          for source in "${apt_sources[@]}"; do
            if grep -Fq 'mirror+file:/etc/apt/apt-mirrors.txt' "${source}"; then
              printf '%s\tpriority:1\n' \
                'http://mirror.yandex.ru/ubuntu/' \
                | tee /etc/apt/apt-mirrors.txt
              configured=1
            fi

            if grep -Eq \
              'https?://([[:alnum:].-]+\.)?archive\.ubuntu\.com/ubuntu/?|https?://security\.ubuntu\.com/ubuntu/?' \
              "${source}"; then
              sed -i -E \
                -e 's#https?://([[:alnum:].-]+\.)?archive\.ubuntu\.com/ubuntu/?#http://mirror.yandex.ru/ubuntu#g' \
                -e 's#https?://security\.ubuntu\.com/ubuntu/?#http://mirror.yandex.ru/ubuntu#g' \
                "${source}"
              configured=1
            fi
          done

          ((configured == 1))
          grep -H --fixed-strings \
            'http://mirror.yandex.ru/ubuntu' "${apt_sources[@]}" \
            || grep -H --fixed-strings \
              'http://mirror.yandex.ru/ubuntu' /etc/apt/apt-mirrors.txt

      - name: Install documented build and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates git build-essential binutils pkg-config python3 \
            cmake ninja-build patchelf gh nodejs qt6-base-dev qt6-image-formats-plugins \
            qt6-declarative-dev qt6-svg-dev qt6-svg-plugins qt6-websockets-dev qt6-l10n-tools \
            qt6-translations-l10n qt6-wayland qtkeychain-qt6-dev \
            libqt6sql6-sqlite libmd4c-dev libssl-dev \
            qml6-module-qtquick qml6-module-qtquick-dialogs \
            qml6-module-qt-labs-folderlistmodel qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-effects \
            qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check installer and package-version regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/native/tests/linux-installer-test.py -v
          python3 packages/native/tests/linux-package-test.py -v
          python3 packages/native/tests/release-notes-test.py -v
          python3 packages/native/tests/matched-screenshot-acceptance-test.py -v
          python3 packages/native/tests/warm-navigation-benchmark-test.py -v

      - name: Configure Release and installed runtime probe
        shell: bash
        run: |
          set -euo pipefail
          cmake -S packages/native -B build/linux-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_INSTALL_LIBDIR=lib

      - name: Build
        run: cmake --build build/linux-release --target workspace-native native-runtime-probe native-updater-test native-about-policy-test native-updater-http2-recovery-driver native-updater-http2-controls-driver api-client-test domain-test native-draft-store-test native-draft-service-test native-drafts-test native-draft-sync-test --parallel "$(nproc)"

      - name: Check owned draft storage and conditional HTTP metadata
        run: ctest --test-dir build/linux-release -R '^native-(api-client|domain|native-draft-(store|service|sync)|native-drafts)$' --output-on-failure

      - name: Check update transport and installer contracts
        run: ctest --test-dir build/linux-release -R '^native-updater$' --output-on-failure

      - name: Check real TLS and HTTP2 update recovery without a native window
        run: ctest --test-dir build/linux-release -R '^native-updater-http2-' --output-on-failure

      - name: Check About policy without creating a native window
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/linux-release -R '^native-about-policy$' --output-on-failure

      - name: Package installed runtime
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version || '' }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            tag_version="${GITHUB_REF_NAME}"
            if [[ -n "${version}" && "${version}" != "${tag_version}" ]]; then
              echo 'Version input does not match tag' >&2
              exit 1
            fi
            version="${tag_version}"
          fi
          if [[ -z "${version}" ]]; then
            version=$(sed -nE 's/^project\(WorkspaceNative VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' packages/native/CMakeLists.txt)
          fi
          version_args=()
          if [[ -n "${version}" ]]; then
            if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo 'Expected stable X.Y.Z' >&2
              exit 1
            fi
            version_args=(--version "${version}")
          fi
          python3 packages/native/scripts/package-linux.py \
            --build-dir "${GITHUB_WORKSPACE}/build/linux-release" \
            --output-dir "${GITHUB_WORKSPACE}/dist/linux" \
            "${version_args[@]}"
          python3 packages/native/tests/verify-installed-runtime.py \
            "${GITHUB_WORKSPACE}/dist/linux/workspace-native-${version}-linux-x86_64" \
            --probe "${GITHUB_WORKSPACE}/build/linux-release/native-runtime-probe"

      - name: Upload Linux packages for review
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: workspace-native-linux-${{ github.sha }}
          path: |
            dist/linux/*.tar.gz
            dist/linux/SHA256SUMS
            dist/linux/package-result.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish Linux release in this repository
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/native/scripts/release-notes.py \
            --version "${GITHUB_REF_NAME}" \
            --out "build/release-notes-${GITHUB_REF_NAME}.md"
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --verify-tag --title "Workspace Native ${GITHUB_REF_NAME} — Linux preview" \
            --notes-file "build/release-notes-${GITHUB_REF_NAME}.md" \
            dist/linux/*.tar.gz dist/linux/SHA256SUMS
